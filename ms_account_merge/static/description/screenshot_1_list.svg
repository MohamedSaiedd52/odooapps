<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- window -->
  <rect x="0.5" y="0.5" width="1359" height="499" rx="8" fill="#ffffff" stroke="#d8dadd"/>

  <!-- top navbar -->
  <path d="M8 0 h1344 a8 8 0 0 1 8 8 v44 h-1360 v-44 a8 8 0 0 1 8 -8 z" fill="#714B67"/>
  <circle cx="34" cy="26" r="11" fill="#ffffff" opacity="0.9"/>
  <circle cx="34" cy="26" r="5" fill="#714B67"/>
  <text x="56" y="31" font-size="15" font-weight="600" fill="#ffffff">Accounting</text>
  <text x="170" y="31" font-size="13" fill="#ffffff" opacity="0.8">Dashboard</text>
  <text x="258" y="31" font-size="13" fill="#ffffff" opacity="0.8">Customers</text>
  <text x="346" y="31" font-size="13" fill="#ffffff" opacity="0.8">Vendors</text>
  <text x="416" y="31" font-size="13" fill="#ffffff" opacity="0.95" font-weight="600">Accounting</text>
  <text x="510" y="31" font-size="13" fill="#ffffff" opacity="0.8">Reporting</text>
  <text x="592" y="31" font-size="13" fill="#ffffff" opacity="0.8">Configuration</text>
  <circle cx="1322" cy="26" r="13" fill="#ffffff" opacity="0.25"/>
  <text x="1316" y="31" font-size="12" fill="#ffffff">A</text>
  <text x="1236" y="31" font-size="13" fill="#ffffff" opacity="0.85" text-anchor="end">My Company</text>

  <!-- control panel -->
  <text x="24" y="88" font-size="18" font-weight="600" fill="#111827">Chart of Accounts</text>
  <!-- selection chip -->
  <rect x="196" y="68" width="104" height="30" rx="15" fill="#f3eef1" stroke="#d8c4d1"/>
  <text x="212" y="88" font-size="13" fill="#714B67" font-weight="600">2 selected</text>
  <text x="284" y="88" font-size="13" fill="#714B67">&#10005;</text>
  <!-- gear (Actions) button -->
  <rect x="312" y="66" width="46" height="34" rx="6" fill="#ffffff" stroke="#d8dadd"/>
  <text x="327" y="90" font-size="17" fill="#374151">&#9881;</text>
  <!-- search box -->
  <rect x="900" y="66" width="436" height="34" rx="6" fill="#ffffff" stroke="#d8dadd"/>
  <circle cx="922" cy="82" r="6" fill="none" stroke="#9ca3af" stroke-width="2"/>
  <line x1="927" y1="87" x2="933" y2="93" stroke="#9ca3af" stroke-width="2"/>
  <text x="944" y="88" font-size="13" fill="#9ca3af">Search...</text>

  <!-- table header -->
  <rect x="16" y="118" width="1328" height="36" fill="#f9fafb"/>
  <line x1="16" y1="154" x2="1344" y2="154" stroke="#d8dadd"/>
  <rect x="34" y="128" width="16" height="16" rx="3" fill="#ffffff" stroke="#b6bac0"/>
  <text x="76" y="141" font-size="13" font-weight="600" fill="#374151">Code</text>
  <text x="200" y="141" font-size="13" font-weight="600" fill="#374151">Account Name</text>
  <text x="640" y="141" font-size="13" font-weight="600" fill="#374151">Type</text>
  <text x="900" y="141" font-size="13" font-weight="600" fill="#374151">Allow Reconciliation</text>
  <text x="1320" y="141" font-size="13" font-weight="600" fill="#374151" text-anchor="end">Balance</text>

  <!-- rows -->
  <!-- row 1 -->
  <rect x="34" y="166" width="16" height="16" rx="3" fill="#ffffff" stroke="#b6bac0"/>
  <text x="76" y="179" font-size="13" fill="#374151">101401</text>
  <text x="200" y="179" font-size="13" fill="#374151">Bank</text>
  <text x="640" y="179" font-size="13" fill="#6b7280">Bank and Cash</text>
  <text x="1320" y="179" font-size="13" fill="#374151" text-anchor="end">24,180.00</text>
  <line x1="16" y1="194" x2="1344" y2="194" stroke="#eceff1"/>
  <!-- row 2 -->
  <rect x="34" y="206" width="16" height="16" rx="3" fill="#ffffff" stroke="#b6bac0"/>
  <text x="76" y="219" font-size="13" fill="#374151">121000</text>
  <text x="200" y="219" font-size="13" fill="#374151">Account Receivable</text>
  <text x="640" y="219" font-size="13" fill="#6b7280">Receivable</text>
  <text x="960" y="219" font-size="13" fill="#28a745">&#10003;</text>
  <text x="1320" y="219" font-size="13" fill="#374151" text-anchor="end">8,540.00</text>
  <line x1="16" y1="234" x2="1344" y2="234" stroke="#eceff1"/>
  <!-- row 3 : SELECTED -->
  <rect x="16" y="234" width="1328" height="40" fill="#f1e7ee"/>
  <rect x="34" y="246" width="16" height="16" rx="3" fill="#714B67"/>
  <path d="M37 254 l4 4 l7 -8" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text x="76" y="259" font-size="13" fill="#374151">400001</text>
  <text x="200" y="259" font-size="13" font-weight="600" fill="#374151">Bank Fees</text>
  <text x="640" y="259" font-size="13" fill="#6b7280">Expenses</text>
  <text x="1320" y="259" font-size="13" fill="#374151" text-anchor="end">7,930.00</text>
  <line x1="16" y1="274" x2="1344" y2="274" stroke="#eceff1"/>
  <!-- row 4 : SELECTED -->
  <rect x="16" y="274" width="1328" height="40" fill="#f1e7ee"/>
  <rect x="34" y="286" width="16" height="16" rx="3" fill="#714B67"/>
  <path d="M37 294 l4 4 l7 -8" stroke="#ffffff" stroke-width="2" fill="none"/>
  <text x="76" y="299" font-size="13" fill="#374151">400002</text>
  <text x="200" y="299" font-size="13" font-weight="600" fill="#374151">Bank Charges</text>
  <text x="640" y="299" font-size="13" fill="#6b7280">Expenses</text>
  <text x="1320" y="299" font-size="13" fill="#374151" text-anchor="end">4,550.00</text>
  <line x1="16" y1="314" x2="1344" y2="314" stroke="#eceff1"/>
  <!-- row 5 -->
  <rect x="34" y="326" width="16" height="16" rx="3" fill="#ffffff" stroke="#b6bac0"/>
  <text x="76" y="339" font-size="13" fill="#374151">400010</text>
  <text x="200" y="339" font-size="13" fill="#374151">Office Supplies</text>
  <text x="640" y="339" font-size="13" fill="#6b7280">Expenses</text>
  <text x="1320" y="339" font-size="13" fill="#374151" text-anchor="end">1,120.00</text>
  <line x1="16" y1="354" x2="1344" y2="354" stroke="#eceff1"/>
  <!-- row 6 -->
  <rect x="34" y="366" width="16" height="16" rx="3" fill="#ffffff" stroke="#b6bac0"/>
  <text x="76" y="379" font-size="13" fill="#374151">600000</text>
  <text x="200" y="379" font-size="13" fill="#374151">Salaries</text>
  <text x="640" y="379" font-size="13" fill="#6b7280">Expenses</text>
  <text x="1320" y="379" font-size="13" fill="#374151" text-anchor="end">54,300.00</text>
  <line x1="16" y1="394" x2="1344" y2="394" stroke="#eceff1"/>

  <!-- actions dropdown (over table) -->
  <rect x="312" y="104" width="230" height="216" rx="8" fill="#ffffff" stroke="#d8dadd" filter="url(#shadow)"/>
  <text x="332" y="136" font-size="13" fill="#374151">Export</text>
  <text x="332" y="172" font-size="13" fill="#374151">Archive</text>
  <text x="332" y="208" font-size="13" fill="#374151">Unarchive</text>
  <text x="332" y="244" font-size="13" fill="#374151">Delete</text>
  <line x1="320" y1="258" x2="534" y2="258" stroke="#eceff1"/>
  <rect x="318" y="266" width="218" height="40" rx="6" fill="#714B67"/>
  <text x="332" y="291" font-size="13" font-weight="600" fill="#ffffff">Merge Accounts</text>

  <!-- caption bar -->
  <rect x="16" y="440" width="1328" height="44" rx="6" fill="#f9fafb" stroke="#eceff1"/>
  <text x="32" y="467" font-size="14" fill="#374151">Select two or more accounts in the Chart of Accounts, then open the
    <tspan font-weight="700" fill="#714B67">&#9881; Actions</tspan> menu and click
    <tspan font-weight="700" fill="#714B67">Merge Accounts</tspan>.</text>
</svg>
